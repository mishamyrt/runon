name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check and package
        run: |
          make check
          make build-release
      - name: Verify tag matches the binary
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(target/release/runon --version)"
      - uses: actions/upload-artifact@v4
        with:
          name: runon-release
          path: dist/
      - name: Publish tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "RunOn ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md \
            dist/runon-macos-arm64.tar.gz dist/SHA256SUMS
