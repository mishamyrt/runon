name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check and package
        run: |
          make check
          make build-release
      - name: Verify tag matches the binary
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(target/release/runon --version)"
      - uses: actions/upload-artifact@v4
        with:
          name: runon-release-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runon-release-*
          path: artifacts/
      - name: Combine and verify release archives
        run: |
          mkdir -p dist
          cp artifacts/runon-release-*/*.tar.gz dist/
          cat artifacts/runon-release-*/SHA256SUMS > dist/SHA256SUMS
          cp artifacts/runon-release-arm64/notes.md dist/notes.md
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: runon-release
          path: dist/
      - name: Publish tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "RunOn ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md \
            dist/runon-macos-arm64.tar.gz dist/runon-macos-x86_64.tar.gz dist/SHA256SUMS
