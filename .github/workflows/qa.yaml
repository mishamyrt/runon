name: Quality Assurance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting, Clippy and tests
        run: make check
      - name: Build and verify release archive
        run: make build-release
      - name: Validate example configurations
        run: |
          target/release/runon check -c examples/config.kdl
          target/release/runon check -c examples/editors.kdl
      - uses: actions/upload-artifact@v4
        with:
          name: runon-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
