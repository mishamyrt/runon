[workspace]
members = [
    "crates/runon",
    "crates/runon-core",
    "crates/runon-macos",
    "crates/runon-runtime",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/mishamyrt/runon"

[workspace.dependencies]
runon-core = { path = "crates/runon-core" }
runon-macos = { path = "crates/runon-macos" }
runon-runtime = { path = "crates/runon-runtime" }
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
lexopt = "0.3.2"
libc = "0.2"
log = "0.4"
oslog = { version = "0.2", default-features = false }
plist = "1"
block2 = "0.6"
dispatch2 = "0.3.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue", "NSNotification", "NSDistributedNotificationCenter", "NSRunLoop", "NSThread", "NSProcessInfo", "NSOperation", "NSEnumerator", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSGraphics", "NSEvent", "NSGraphicsContext", "block2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFString", "CFDictionary", "CFNumber", "CFArray"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "block2", "dispatch2"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "ps"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
