[workspace]
members = [
    "crates/runon",
    "crates/runon-config",
    "crates/runon-core",
    "crates/runon-macos",
    "crates/runon-runtime",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/mishamyrt/runon"

[workspace.dependencies]
runon-config = { path = "crates/runon-config" }
runon-core = { path = "crates/runon-core" }
runon-macos = { path = "crates/runon-macos" }
runon-runtime = { path = "crates/runon-runtime" }
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
lexopt = "0.3.2"
libc = "0.2"
log = "0.4"
oslog = { version = "0.2", default-features = false }
lunchd = "0.2.1"
block2 = "0.6"
dispatch2 = "0.3.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSData", "NSError", "NSPropertyList", "NSString", "NSValue", "NSNotification", "NSDistributedNotificationCenter", "NSRunLoop", "NSThread", "NSProcessInfo", "NSOperation", "NSEnumerator", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSGraphics", "NSEvent", "NSGraphicsContext", "block2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFString", "CFDictionary", "CFNumber", "CFArray"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "block2", "dispatch2"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "ps"] }


[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
single_match_else = "allow"
too_many_lines = "allow"
needless_raw_string_hashes = "allow"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
redundant_clone = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
large_stack_arrays = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
